plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

base {
	archivesName = project.archives_base_name
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
	maven { url = 'https://maven.terraformersmc.com/releases/' }
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"chatcraft" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	modImplementation "com.terraformersmc:modmenu:${project.modmenu_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

// Loom creates the runClient argument file during project configuration. Reusing
// Gradle's configuration cache after `clean` can otherwise reference a deleted file.
tasks.named("runClient").configure {
	notCompatibleWithConfigurationCache("Fabric Loom run argument files must be regenerated")
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName
	archiveFileName = "chatcraft-dev.jar"

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

tasks.named("remapJar").configure {
	archiveFileName = "chatcraft.jar"
}

tasks.named("sourcesJar").configure {
	archiveFileName = "chatcraft-sources.jar"
}

tasks.named("remapSourcesJar").configure {
	archiveFileName = "chatcraft-sources.jar"
}

abstract class VerifyPrismInstance extends DefaultTask {
	@Input
	abstract Property<String> getExpectedUuid()

	@InputFile
	abstract RegularFileProperty getInstanceConfig()

	@TaskAction
	void verify() {
		def config = instanceConfig.get().asFile
		def expected = "uuid=${expectedUuid.get()}"
		if (!config.readLines("UTF-8").any { it.trim() == expected }) {
			throw new GradleException("Prism instance UUID does not match ${config.parentFile.name}")
		}
	}
}

def prismInstancesPath = providers.gradleProperty("prism_instances_path").get()
def prismLauncherExecutable = providers.gradleProperty("prism_launcher_path").get()
def prismInstanceId = providers.gradleProperty("prism_instance_id").get()
def prismInstanceUuid = providers.gradleProperty("prism_instance_uuid").get()
def prismInstanceDirectory = file("${prismInstancesPath}/${prismInstanceId}")
def prismChatCraftMods = new File(prismInstanceDirectory, "minecraft/mods")

def verifyPrismInstance = tasks.register("verifyPrismInstance", VerifyPrismInstance) {
	group = "custom"
	description = "Verifies that the configured Prism folder belongs to the expected instance UUID."
	expectedUuid.set(prismInstanceUuid)
	instanceConfig.set(new File(prismInstanceDirectory, "instance.cfg"))
}

def removeOldPrismChatCraft = tasks.register("removeOldPrismChatCraft", Delete) {
	group = "custom"
	description = "Removes existing ChatCraft JARs from the configured Prism Launcher instance."
	dependsOn verifyPrismInstance
	delete fileTree(prismChatCraftMods) {
		include "chatcraft*.jar"
		include "chatcraft*.jar.disabled"
	}
}

tasks.register("buildToPrismLauncher", Copy) {
	group = "custom"
	description = "Builds ChatCraft and installs it as chatcraft.jar in the ChatCraft Prism Launcher instance."
	dependsOn removeOldPrismChatCraft
	from tasks.named("remapJar").flatMap { it.archiveFile }
	into prismChatCraftMods
	rename { "chatcraft.jar" }
}

tasks.register("startPrism", Exec) {
	group = "custom"
	description = "Builds and installs ChatCraft, then launches the configured Prism Launcher instance without blocking Gradle."
	dependsOn tasks.named("buildToPrismLauncher")
	environment "CHATCRAFT_PRISM_EXE", prismLauncherExecutable
	environment "CHATCRAFT_PRISM_INSTANCE", prismInstanceId
	environment "CHATCRAFT_PRISM_LAUNCH_FLAG", "--launch"
	commandLine "powershell.exe", "-NoLogo", "-NoProfile", "-NonInteractive", "-Command",
		'Start-Process -FilePath $env:CHATCRAFT_PRISM_EXE -ArgumentList @($env:CHATCRAFT_PRISM_LAUNCH_FLAG, $env:CHATCRAFT_PRISM_INSTANCE) -WindowStyle Normal'
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
